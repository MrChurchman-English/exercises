<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Literary terms in context</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3eb;color:#252f2a;font:17px/1.5 "Inter",Arial,sans-serif}main{max-width:860px;margin:auto;padding:32px 20px 60px}header{border-top:5px solid #235346;border-bottom:1px solid #aaa99c;padding:22px 0}h1,blockquote{font-family:"Baskervville",Georgia,serif}h1{font-size:clamp(34px,6vw,58px);letter-spacing:-.045em;line-height:1.05;margin:0}header p{margin:12px 0 0}nav,.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}nav{padding:20px 0}button,input{font:inherit}button{border:1px solid #888c80;background:#fffdf7;border-radius:6px;padding:8px 16px;color:inherit;cursor:pointer}button[aria-current=true],.primary{background:#235346;color:white;border-color:#235346}button:disabled{opacity:.55;cursor:default}article{background:#fffef9;padding:clamp(18px,4vw,38px);border:1px solid #d4d2c6;border-radius:8px}blockquote{margin:20px 0 24px;padding-left:20px;border-left:3px solid #bb8a5b;font-size:clamp(20px,3vw,25px);line-height:1.45}h2{font-size:21px;line-height:1.35}label{display:flex;gap:12px;border:1px solid #c8ccc3;border-radius:6px;padding:10px 14px;margin:8px 0;align-items:baseline}label:has(:checked){background:#e5efe9;border-color:#235346}input[type=text]{padding:10px;width:100%;border:1px solid #848f85;border-radius:5px}form button{margin-top:10px}#msg:not(:empty){background:#edf1e9;padding:12px 16px;border-radius:6px;margin-top:12px}footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}small{color:#435a50}progress{width:100%;height:8px;accent-color:#235346}button:focus-visible,input:focus-visible{outline:3px solid #b56220;outline-offset:3px}
</style><main><header><h1>Literary terms in context</h1><p>Read each passage closely. You have three attempts per question.</p></header><nav aria-label="Exercise sections"></nav><small id="status"></small><progress max="24" value="0" aria-label="Questions completed"></progress><article><small id="count"></small><blockquote id="passage"></blockquote><h2 id="question" tabindex="-1"></h2><form aria-labelledby="question"><div id="answers"></div><button class="primary" id="check">Check answer</button></form><div id="msg" role="status"></div></article><footer><button id="prev">← Previous</button><button id="next">Next →</button></footer><section id="summary" hidden></section></main><script>
const sections=['Genres and forms','Name the technique','Read the evidence'];
const data=[{"p": "\u201cDear Nell, you asked what I took when I left home. Only the blue coat.\u201d The next chapter opens with Nell\u2019s reply. \u201cDear Kit, then how do you explain the empty space above the mantelpiece?\u201d Their exchange continues, letter by letter, to the final page.", "q": "Which term best describes the form of this novel?", "options": ["Epistolary novel", "Detective novel", "Historical novel", "Gothic novel"], "keys": ["Epistolary novel"], "h": "How does each new piece of information reach the reader?", "why": "This is an epistolary novel. We discover what Kit claims and what Nell suspects by reading the letters they send each other."}, {"p": "The novel\u2019s conductor has a fictional name. Musicians who worked with the author recognise him immediately from his rehearsal habits and the scandal that ended his career.", "q": "Which term captures the relationship between this character and his real-life counterpart?", "options": ["Autobiography", "Biography", "Roman \u00e0 clef", "Historical novel"], "keys": ["Roman \u00e0 clef"], "h": "What would an insider know that another reader might miss?", "why": "Readers with the \u201ckey\u201d can identify the real person behind the invented name and details."}, {"p": "At twelve, Ada thinks that respect means never questioning her father. By twenty-five, after trying first to please him and then to shock him, she can finally disagree with him without rehearsing the argument.", "q": "Which genre does this account of the novel\u2019s development most strongly suggest?", "options": ["Biography", "Roman \u00e0 clef", "Bildungsroman", "Thriller"], "keys": ["Bildungsroman"], "h": "Trace the change in Ada\u2019s understanding of respect.", "why": "Ada\u2019s changing relationship with authority organises the novel around her journey towards maturity. The list also calls this a coming-of-age novel."}, {"p": "The opening page shows us who planted the device. For the next two hundred pages we follow a translator trying to get a warning through before the summit begins.", "q": "Which genre best fits the main source of suspense?", "options": ["Detective novel", "Autobiography", "Thriller", "Gothic novel"], "keys": ["Thriller"], "h": "What question keeps the reader turning the pages?", "why": "The pressing question is whether the warning will arrive in time. The culprit\u2019s identity is already known."}, {"p": "A new tenant hears footsteps in a wing that was bricked up before she was born. The family will explain neither the footsteps nor the fresh mud on the nursery floor.", "q": "Which kind of novel does this opening most clearly evoke?", "options": ["Epistolary novel", "Historical novel", "Gothic novel", "Science fiction novel"], "keys": ["Gothic novel"], "h": "Consider the relationship between the building, the family secret and the unexplained event.", "why": "The sealed wing and the possibility of a supernatural presence make the family home a source of dread."}, {"p": "A boy hands his sister a watch. In the next panel she has grey hair and still wears it. No caption tells us how much time has passed.", "q": "Which form makes the leap in time through this sequence of images?", "options": ["Epistolary novel", "Sonnet", "Ballad", "Graphic novel"], "keys": ["Graphic novel"], "h": "Where does the reader find the information that a narrator might otherwise supply?", "why": "The meaning emerges from the relationship between successive panels. This use of sequential art is characteristic of a graphic novel."}, {"p": "In the rehearsed version of her childhood, an actor speaks for the author. In the published book, the author gives a factual account of her own life and names the people who raised her.", "q": "Which term best describes the published book?", "options": ["Roman \u00e0 clef", "Autobiography", "Biography of another person", "Bildungsroman"], "keys": ["Autobiography"], "h": "Who is responsible for the account, and whose life does it recount?", "why": "The author recounts her own life. Childhood and growing up can be subjects of both autobiography and fiction."}, {"p": "An invented seamstress mends a real general\u2019s uniform on the eve of a documented uprising. The author uses surviving street plans to reconstruct the route she takes home.", "q": "Which genre best describes the author\u2019s combination of invention and documented events?", "options": ["Historical novel", "Epic poetry", "Autobiography", "Roman \u00e0 clef"], "keys": ["Historical novel"], "h": "Consider whether the real figure has been disguised.", "why": "An invented life unfolds within a reconstructed historical event. The general can appear under his own name."}, {"p": "The clerk placed the pen beside the form. Eight years earlier, in this same office, his mother had held that pen between both hands. \u201cSign here,\u201d the clerk had told her. Now it was his turn.", "q": "What term describes the shift into the scene with his mother?", "options": null, "keys": ["flashback"], "h": "Look at where the middle scene falls in relation to the signing.", "why": "The narration leaves the present scene, dramatises an earlier encounter, then returns to the pen on the desk."}, {"p": "When the chandelier crashed through the table and into the wine cellar, Aunt May inspected the hole. \u201cThat will need a little attention,\u201d she said.", "q": "Which device depends specifically on the small scale of May\u2019s description?", "options": null, "keys": ["understatement"], "h": "Compare the size of the damage with the size of the task her words imply.", "why": "\u201cA little attention\u201d makes a major repair sound trivial. The gap between scale and description produces the humour."}, {"p": "She counted the cups twice before opening the door. When her guest declined tea, she took a cup down anyway, so he would have something warm to hold.", "q": "Which method of characterisation lets us infer her concern from her behaviour?", "options": null, "keys": ["indirect characterisation", "indirect characterization", "indirect"], "h": "Could you underline a sentence in which the narrator explicitly calls her considerate?", "why": "We infer care from the extra cup. The narrator gives us the behaviour and leaves the judgement to us."}, {"p": "Ruth heard the latch click. He must be leaving, she thought. Across the room Daniel was silently hoping she would ask him to stay. Neither guessed what the other wanted.", "q": "Which kind of third-person narrator can disclose both private thoughts here?", "options": null, "keys": ["omniscient", "omniscient narrator", "omniscient third person narrator", "third person omniscient narrator", "omniscient third person", "third person omniscient"], "h": "Count how many characters\u2019 private thoughts the reader can verify.", "why": "The narrator gives independent access to Ruth\u2019s inference and Daniel\u2019s hope, even as each misunderstands the other."}, {"p": "In the town of Merit, the award for modesty went to whichever councillor bought the largest advertisement celebrating their own humility.", "q": "Which device makes a public institution ridiculous in order to criticise its values?", "options": null, "keys": ["satire"], "h": "Think about the target of the joke as well as the contradiction in the award.", "why": "The award exposes a political culture that turns even modesty into self-promotion. The contradiction supplies the irony within the satire."}, {"p": "The last train had gone. Under the platform lamps the benches gleamed like wet teeth. Each time the wind lifted a paper cup, I turned round.", "q": "Which term names the feeling of unease created by these details?", "options": null, "keys": ["atmosphere"], "h": "Distinguish the station itself from the feeling it creates.", "why": "The deserted platform is the setting. The threatening comparison and the speaker\u2019s nervous reactions create the atmosphere."}, {"p": "In the closing paragraph, Lian finds the missing page and learns who betrayed her. She folds it and knocks on her sister\u2019s door. The story ends before the sister answers.", "q": "Which term describes the way the story leaves the sisters\u2019 relationship unresolved?", "options": null, "keys": ["open ending", "open end"], "h": "Separate the solved mystery from the unanswered personal question.", "why": "The missing page settles who betrayed Lian. The reader must decide what might follow the knock."}, {"p": "The confession has already been made and the jury has delivered its verdict. In the final pages the witnesses collect their coats and we learn which of them will still speak to one another.", "q": "Which structural term describes these final pages tracing the consequences?", "options": null, "keys": ["denouement", "resolution"], "h": "Where do these pages come in relation to the decisive event?", "why": "The d\u00e9nouement, or resolution, follows the decisive action and shows how matters settle afterwards."}, {"p": "Mina watched Joel hold the envelope against the light. He looked pleased. Or was that relief? She wished he would open it before she had time to change her mind.", "q": "Which detail most clearly establishes a selective third-person narrator?", "options": ["The envelope is described without quoting its contents.", "Both characters are referred to by name.", "Joel performs an action that Mina can see.", "We know Mina\u2019s wish, while Joel\u2019s feelings remain a guess."], "keys": ["We know Mina\u2019s wish, while Joel\u2019s feelings remain a guess."], "h": "Ask whose inner life the reader can verify.", "why": "\u201cShe wished\u201d gives direct access to Mina. The question about relief registers her uncertainty about Joel."}, {"p": "A woman set a suitcase on the step. The man inside drew the curtain. She pressed the bell once, straightened the mat and sat on the case.", "q": "Which addition would break the unobtrusive narrator\u2019s restriction to observable action?", "options": ["A key scraped against the lock.", "He hoped she had forgotten the key.", "She kept one finger on the bell.", "Behind the curtain, his hand shook."], "keys": ["He hoped she had forgotten the key."], "h": "Which detail could a camera or microphone never establish on its own?", "why": "A hope is a private mental state. A shaking hand can be observed even when its cause remains uncertain."}, {"p": "\u201cI knew my brother had taken the cash. He always whistled when he lied.\u201d Later, a receipt shows that the money had already been paid into the bank.", "q": "Which claim about this first-person narrator does the passage support?", "options": ["The narrator has access to the brother\u2019s thoughts.", "The author personally suspected their brother.", "The first-person voice establishes that the story is autobiographical.", "The narrator reports an inference as though it were knowledge."], "keys": ["The narrator reports an inference as though it were knowledge."], "h": "What is the narrator\u2019s evidence for the accusation?", "why": "Whistling is the narrator\u2019s sole clue. The receipt gives readers grounds to question that interpretation."}, {"p": "Ellis reports a colleague for stealing bread. That evening he slips money into the colleague\u2019s locker, then checks twice that nobody saw him do it.", "q": "Which detail offers the strongest case for reading Ellis as a round character?", "options": ["His enforcement of a rule coexists with sympathy and a desire for secrecy.", "The narrator gives him a name and describes several movements.", "He appears both at work and after his shift.", "Both incidents occur on the same day."], "keys": ["His enforcement of a rule coexists with sympathy and a desire for secrecy."], "h": "Look for competing impulses within the same person.", "why": "Ellis\u2019s actions suggest several motives in tension. Their coexistence gives the reader a complex character to interpret."}, {"p": "A story opens with a village that has shared a well for a century. During a drought, one family locks it. Neighbours gather with buckets. The youngest daughter cuts the chain in front of everyone. By winter, each household has a key.", "q": "Which event functions as the climax of the central conflict?", "options": ["The neighbours gather outside the locked well.", "Each household receives a key.", "The opening establishes the village custom.", "The daughter publicly cuts the chain."], "keys": ["The daughter publicly cuts the chain."], "h": "At what moment does the struggle over access reach its decisive point?", "why": "Cutting the chain breaks the family\u2019s control at the height of the confrontation. The distribution of keys belongs to the resolution."}, {"p": "A story follows a cashier through the last ten minutes of an ordinary shift. She sorts the coins, practises a greeting for her son and misses a bus. The narration ends as she starts walking.", "q": "Which feature best supports calling this a \u201cslice of life\u201d?", "options": ["The sequence traces the cashier\u2019s growth from childhood to maturity.", "The ending settles the cashier\u2019s relationship with her son.", "The missed bus reveals a hidden motive for sorting the coins.", "A brief stretch of routine suggests a life continuing beyond the page."], "keys": ["A brief stretch of routine suggests a life continuing beyond the page."], "h": "Think about the scale of the events the writer chooses to show.", "why": "The greetings, coins and missed bus are ordinary details. Together they give us a glimpse of a larger life."}, {"p": "For most of the story, the prisoner receives letters apparently written by his daughter. In the final line the guard puts away a child\u2019s handwriting primer and starts tomorrow\u2019s letter.", "q": "What makes the ending a twist?", "options": ["It forces us to reinterpret the authorship of the earlier letters.", "It tells us that another letter will arrive tomorrow.", "It leaves the prisoner\u2019s release date uncertain.", "It shifts attention from the prisoner to a second character."], "keys": ["It forces us to reinterpret the authorship of the earlier letters."], "h": "What changes about the reader\u2019s understanding of what has already happened?", "why": "The primer and the guard\u2019s writing suggest that the correspondence was his work. The revelation changes the meaning of earlier scenes."}, {"p": "\u201cSuch a punctual institution,\u201d Noor said as the courthouse clock struck eleven and the clerk unlocked the doors for the nine o\u2019clock hearing.", "q": "Which detail makes Noor\u2019s remark ironic?", "options": ["Noor comments on the institution as a whole.", "The clerk\u2019s arrival ends the waiting.", "The clock provides precise information about the setting.", "The time of opening contradicts the praise expressed by \u201cpunctual\u201d."], "keys": ["The time of opening contradicts the praise expressed by \u201cpunctual\u201d."], "h": "Compare the literal judgement with the timetable.", "why": "The two-hour delay invites us to understand \u201cpunctual\u201d as criticism voiced through apparent praise."}];
const el=id=>document.getElementById(id);
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[‐‑–—-]/g,' ').replace(/[.!?]+$/,'').trim().replace(/^(the|an|a)\s+/,'').replace(/\s+/g,' ');
let i=0;const states=data.map(()=>({wrong:[],done:false,success:false,value:'',note:''}));
const buttons=sections.map((title,n)=>{const b=document.createElement('button');b.textContent=title;b.onclick=()=>go(n*8);document.querySelector('nav').append(b);return b});
function go(n){i=n;el('summary').hidden=true;render();el('question').focus()}
function render(){
 const d=data[i],s=states[i],typed=!d.options;
 buttons.forEach((b,n)=>b.setAttribute('aria-current',String(n===Math.floor(i/8))));
 el('status').textContent=states.filter(x=>x.done).length+' of 24 completed';document.querySelector('progress').value=states.filter(x=>x.done).length;
 el('count').textContent=sections[Math.floor(i/8)]+'  ·  '+(i%8+1)+' of 8';
 el('passage').textContent=d.p;el('question').textContent=d.q;
 const box=el('answers');box.replaceChildren();
 if(typed){const input=document.createElement('input');input.type='text';input.placeholder='Enter the literary term';input.setAttribute('aria-label','Literary term');input.value=s.value;input.autocomplete='off';input.spellcheck=false;input.disabled=s.done;input.oninput=()=>s.value=input.value;box.append(input)}
 else for(const value of d.options){const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='choice';input.checked=s.value===value;input.disabled=s.done||s.wrong.includes(norm(value));input.onchange=()=>s.value=value;label.append(input,document.createTextNode(value));box.append(label)}
 el('check').hidden=s.done;el('msg').textContent=s.note;el('prev').disabled=i===0;el('next').textContent=i===23?'View results':'Next →';
}
document.querySelector('form').onsubmit=e=>{e.preventDefault();const d=data[i],s=states[i];if(s.done)return;
 const value=norm(s.value);if(!value){el('msg').textContent='Enter or select an answer first.';return}
 if(s.wrong.includes(value)){el('msg').textContent='Try a different answer. '+d.h;return}
 s.success=d.keys.some(k=>norm(k)===value);if(!s.success)s.wrong.push(value);
 s.done=s.success||s.wrong.length===3;
 s.note=s.done?(s.success?'Correct. ':'Model answer: '+d.keys[0]+'. ')+d.why:'Try again. '+d.h+' ('+(3-s.wrong.length)+' attempts left.)';
 if(!s.done)s.value='';render();if(!s.done)el('answers').querySelector('input:not(:disabled)').focus()};
el('prev').onclick=()=>go(i-1);
el('next').onclick=()=>{if(i<23){go(i+1);return}const sum=el('summary');sum.replaceChildren();sum.hidden=false;const head=document.createElement('h2');head.textContent='Your results';sum.append(head);const p=document.createElement('p'),done=states.filter(s=>s.done).length;
p.textContent=states.filter(s=>s.success).length+' answered correctly, including '+states.filter(s=>s.success&&!s.wrong.length).length+' on the first attempt. Model answers revealed: '+states.filter(s=>s.done&&!s.success).length+'. Unfinished: '+(24-done)+'.';sum.append(p);
if(done<24){const b=document.createElement('button');b.textContent='Continue unfinished questions';b.onclick=()=>go(states.findIndex(s=>!s.done));sum.append(b)}sum.scrollIntoView({block:'center'})};
render();
</script></html>
